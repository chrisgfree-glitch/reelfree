name: Nightly link check
on:
  schedule:
    - cron: '17 9 * * *'   # ~1:17 AM Pacific; GitHub-hosted runners are in the US
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: link-check, cancel-in-progress: false }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/check-links.mjs
      - name: Commit status
        run: |
          git config user.name "reelfree-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status.json
          git diff --cached --quiet || (git commit -m "Link check $(date -u +%F)" && git push)
